name: Render Sun Vanished (9:16, 1200 frames)

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  render:
    name: Render frames ${{ matrix.start }}-${{ matrix.end }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - { start: 0,    end: 120 }
          - { start: 120,  end: 240 }
          - { start: 240,  end: 360 }
          - { start: 360,  end: 480 }
          - { start: 480,  end: 600 }
          - { start: 600,  end: 720 }
          - { start: 720,  end: 840 }
          - { start: 840,  end: 960 }
          - { start: 960,  end: 1080 }
          - { start: 1080, end: 1200 }
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install; fi
          npx playwright install --with-deps chromium

      - name: Render shard
        run: node render-farm.js ${{ matrix.start }} ${{ matrix.end }}

      - name: Upload frames
        uses: actions/upload-artifact@v4
        with:
          name: frames-${{ matrix.start }}-${{ matrix.end }}
          path: frames/*.jpg
          if-no-files-found: error
          retention-days: 7

  assemble:
    name: Assemble silent video
    needs: render
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download all frame shards
        uses: actions/download-artifact@v4
        with:
          pattern: frames-*
          path: allframes
          merge-multiple: true

      - name: Verify frame count
        run: |
          count=$(find allframes -name '*.jpg' | wc -l)
          echo "Frames downloaded: $count (expected 1200)"
          ls allframes | head -3
          ls allframes | tail -3
          if [ "$count" -lt 1190 ]; then
            echo "::error::Only $count frames found, expected ~1200 — aborting assembly"
            exit 1
          fi

      - name: Install ffmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Encode silent picture video
        run: |
          ffmpeg -y -framerate 30 -i 'allframes/f%04d.jpg' \
            -c:v libx264 -crf 20 -pix_fmt yuv420p -r 30 \
            -vf 'scale=1080:1920' \
            sun-vanished-silent.mp4
          ffprobe -v error -show_entries stream=width,height,r_frame_rate,codec_name \
            -show_entries format=duration,size -of default=noprint_wrappers=1 \
            sun-vanished-silent.mp4

      - name: Upload silent video artifact
        uses: actions/upload-artifact@v4
        with:
          name: final-silent-video
          path: sun-vanished-silent.mp4
          if-no-files-found: error
          retention-days: 7

      - name: Commit video to render-output branch (if under 25 MB)
        run: |
          size=$(stat -c%s sun-vanished-silent.mp4)
          echo "Video size: $size bytes"
          if [ "$size" -lt 25000000 ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git checkout --orphan render-output-tmp
            git rm -rf . >/dev/null 2>&1 || true
            git add -f sun-vanished-silent.mp4
            git commit -m "Silent picture render (1080x1920, 30fps, frames only)"
            git push -f origin HEAD:render-output
          else
            echo "Video is 25 MB or larger — artifact only, not committed to a branch."
          fi
